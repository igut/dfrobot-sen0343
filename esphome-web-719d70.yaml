esphome:
  name: esphome-web-719d70
  friendly_name: WemosWifiDev
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: arduino

external_components:
  - source:
      type: git
      url: https://github.com/igut/dfrobot-sen0343
      ref: main
    components: [sen0343]

# Enable logging
logger:

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
- platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: false
#  frequency: 100kHz

sensor:
  - platform: sen0343
    address: 0x00        # default; the sensor really does answer at 0x00
    update_interval: 1s
    pressure:
      name: "Differential Pressure"
      filters:
        - sliding_window_moving_average:
            window_size: 5    # ~5 s of readings at 1 s polling
            send_every: 1     # publish a fresh average every reading
    temperature:
      name: "Pressure Sensor Temperature"
      filters:
        - sliding_window_moving_average:
            window_size: 5
            send_every: 5

